apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: shopeasy-dev
  region: ap-south-1

vpc:
  id: vpc-0e62f617f94378221
  subnets:
    public:
      ap-south-1a:
        id: subnet-05ab0148d007103d4
      ap-south-1b:
        id: subnet-0eef3bebbb62c887f

managedNodeGroups:
  - name: shopeasy-nodes
    instanceType: t3.medium
    minSize: 1
    maxSize: 2
    desiredCapacity: 1
    amiFamily: AmazonLinux2023
